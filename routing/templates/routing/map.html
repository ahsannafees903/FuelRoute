<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FuelRoute &mdash; Optimal Fuel Stop Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0B0F19;
  --bg2:#111827;
  --bg3:#1F2937;
  --card:#161F30;
  --card-hover:#1C283F;
  --border:rgba(255,255,255,0.08);
  --border-light:rgba(255,255,255,0.15);
  --text:#F3F4F6;
  --text2:#9CA3AF;
  --text3:#6B7280;
  --accent:#7C4DFF;
  --accent2:#9E75FF;
  --accent-glow:rgba(124,77,255,0.2);
  --green:#10B981;
  --green2:#059669;
  --green-glow:rgba(16,185,129,0.15);
  --amber:#F59E0B;
  --amber-glow:rgba(245,158,11,0.15);
  --red:#EF4444;
  --red-glow:rgba(239,68,68,0.15);
  --blue:#3B82F6;
  --panel-w:440px;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 8px 30px rgba(0,0,0,0.5);
  --transition:0.25s cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

.app{display:flex;height:100vh;width:100vw;position:relative}

/* Side Panel */
#panel{
  width:var(--panel-w);
  min-width:var(--panel-w);
  height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  border-right:1px solid var(--border);
  z-index:1000;
  position:relative;
  transition:margin-left var(--transition);
  box-shadow:var(--shadow);
}
#panel.collapsed{margin-left:calc(-1 * var(--panel-w))}

/* Map Wrap */
#map-wrap{flex:1;position:relative;height:100vh}
#m{height:100%;width:100%;background:#090D16}

/* Toggle Button */
.toggle-btn{
  position:absolute;top:16px;left:16px;z-index:1100;
  width:42px;height:42px;border-radius:var(--radius-sm);
  background:var(--bg2);border:1px solid var(--border);
  color:var(--text);cursor:pointer;display:flex;
  align-items:center;justify-content:center;
  font-size:16px;transition:all var(--transition);box-shadow:var(--shadow);
}
.toggle-btn:hover{background:var(--bg3);border-color:var(--accent);color:var(--accent2)}

/* Search Header */
.search-header{
  padding:20px 22px 16px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, rgba(31,41,55,0.7) 0%, rgba(17,24,39,0.9) 100%);
  backdrop-filter:blur(8px);
}
.logo-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:34px;height:34px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--accent),var(--green));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:17px;font-weight:900;
}
.logo-text{
  font-size:19px;font-weight:800;letter-spacing:-0.5px;
  background:linear-gradient(135deg,#fff,#D1D5DB);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.tag-badge{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  padding:3px 8px;border-radius:20px;
  background:var(--accent-glow);color:var(--accent2);border:1px solid rgba(124,77,255,0.3);
}

.search-row{display:flex;flex-direction:column;gap:10px}
.input-wrap{display:flex;gap:8px;align-items:center}
.inputs-col{flex:1;display:flex;flex-direction:column;gap:8px}
.input-group{position:relative}
.input-group label{
  position:absolute;top:-7px;left:10px;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.8px;color:var(--accent2);
  background:var(--bg2);padding:0 5px;border-radius:3px;z-index:2;
}
.input-group input{
  width:100%;padding:11px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg);
  color:var(--text);font-size:13px;font-family:inherit;outline:none;
  transition:all var(--transition);
}
.input-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.input-group input::placeholder{color:var(--text3)}

.swap-btn{
  width:38px;height:38px;border-radius:var(--radius-sm);
  background:var(--bg);border:1px solid var(--border);
  color:var(--text2);cursor:pointer;display:flex;
  align-items:center;justify-content:center;font-size:16px;
  transition:all var(--transition);flex-shrink:0;
}
.swap-btn:hover{color:var(--accent2);border-color:var(--accent);background:var(--bg3)}

/* Presets */
.presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.preset-chip{
  font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  color:var(--text2);cursor:pointer;white-space:nowrap;transition:all var(--transition);
}
.preset-chip:hover{background:var(--accent-glow);color:var(--text);border-color:var(--accent2)}

.plan-btn{
  width:100%;padding:12px;border:none;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--accent),#6D28D9);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  letter-spacing:0.3px;transition:all var(--transition);
  position:relative;overflow:hidden;box-shadow:0 4px 14px var(--accent-glow);
}
.plan-btn:hover{filter:brightness(1.15);transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
.plan-btn:active{transform:translateY(0)}
.plan-btn.loading{pointer-events:none;opacity:0.8}
.plan-btn.loading .btn-text{visibility:hidden}
.plan-btn.loading::after{
  content:'';position:absolute;top:50%;left:50%;width:20px;height:20px;
  margin:-10px 0 0 -10px;border:2px solid transparent;border-top:2px solid #fff;
  border-radius:50%;animation:spin 0.6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error Banner */
.error-banner{
  margin:12px 20px 0;padding:12px 14px;border-radius:var(--radius-sm);
  background:var(--red-glow);border:1px solid rgba(239,68,68,0.3);
  color:#FCA5A5;font-size:12px;line-height:1.4;display:none;
  align-items:flex-start;gap:10px;animation:shake 0.4s ease;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.error-close{cursor:pointer;opacity:0.7;font-weight:700;font-size:14px;margin-left:auto}
.error-close:hover{opacity:1}

/* Scrollable Panel Body */
.panel-body{
  flex:1;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.panel-body::-webkit-scrollbar{width:6px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Empty State */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;padding:40px 24px;text-align:center;color:var(--text2);
}
.empty-icon{
  width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.03);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:28px;margin-bottom:16px;color:var(--accent2);
}
.empty-title{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--text)}
.empty-sub{font-size:12px;line-height:1.5;max-width:280px;color:var(--text3);margin-bottom:18px}

/* Results Content */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px 10px}
.summary-card{
  padding:14px;border-radius:var(--radius-sm);background:var(--card);
  border:1px solid var(--border);transition:all var(--transition);
}
.summary-card:hover{border-color:var(--border-light);background:var(--card-hover)}
.summary-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);margin-bottom:4px}
.summary-val{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.summary-val.accent{color:var(--accent2)}
.summary-val.green{color:var(--green)}
.summary-val.amber{color:var(--amber)}

/* Cost Breakdown Bar */
.cost-breakdown{
  margin:0 20px 12px;padding:12px 14px;border-radius:var(--radius-sm);
  background:var(--card);border:1px solid var(--border);
}
.cost-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);margin-bottom:8px}
.cost-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:3px 0}
.cost-label{display:flex;align-items:center;gap:6px;color:var(--text2)}
.cost-dot{width:8px;height:8px;border-radius:50%}
.cost-num{font-weight:700;font-variant-numeric:tabular-nums}
.cost-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:8px;font-size:13px}
.cost-row.total .cost-label{color:var(--text);font-weight:700}
.cost-row.total .cost-num{color:var(--green);font-size:15px}

/* Origin Fuel Card */
.start-card{
  margin:0 20px 12px;padding:12px 14px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,rgba(124,77,255,0.1) 0%, var(--card) 100%);
  border:1px solid rgba(124,77,255,0.25);
}
.start-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.start-card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--accent2)}
.start-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.start-note{font-size:11px;color:var(--text3);margin-top:8px;padding:6px 8px;border-radius:4px;background:var(--bg);line-height:1.4}

/* Collapsible Sections */
.section{border-top:1px solid var(--border)}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;cursor:pointer;user-select:none;transition:background var(--transition);
}
.section-head:hover{background:var(--bg3)}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text2)}
.section-meta{display:flex;align-items:center;gap:8px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;background:var(--accent-glow);color:var(--accent2)}
.badge.warn{background:var(--amber-glow);color:var(--amber)}
.chevron{font-size:11px;color:var(--text3);transition:transform var(--transition)}
.section.open .chevron{transform:rotate(180deg)}
.section-body{display:none;padding:0 20px 14px}
.section.open .section-body{display:block}

/* Stop Cards */
.stop-card{
  padding:12px 14px;border-radius:var(--radius-sm);background:var(--card);
  border:1px solid var(--border);margin-bottom:8px;cursor:pointer;
  transition:all var(--transition);position:relative;overflow:hidden;
}
.stop-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);opacity:0;transition:opacity var(--transition);
}
.stop-card:hover{border-color:var(--accent);background:var(--card-hover);transform:translateX(2px)}
.stop-card:hover::before{opacity:1}
.stop-card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);background:var(--card-hover)}
.stop-card.active::before{opacity:1}

.stop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.stop-badge{
  width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#9333EA);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;
}
.stop-info{flex:1;min-width:0}
.stop-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-sub{font-size:11px;color:var(--text3);margin-top:1px}
.stop-price{
  padding:3px 8px;border-radius:4px;background:var(--green-glow);
  color:var(--green);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0;
}

.stop-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.stop-m-box{text-align:center;padding:6px 2px;border-radius:4px;background:var(--bg)}
.stop-m-val{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.stop-m-lbl{font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-top:2px}

/* Gauge */
.gauge{
  display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;
  background:var(--bg);font-size:10px;color:var(--text2);margin-top:6px;
}
.gauge-bar{flex:1;height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.gauge-fill{height:100%;border-radius:3px;transition:width 0.4s ease}
.gauge-fill.low{background:var(--red)}
.gauge-fill.mid{background:var(--amber)}
.gauge-fill.high{background:var(--green)}

.detour-info{
  font-size:10.5px;color:var(--text3);margin-top:6px;
  display:flex;align-items:center;justify-content:space-between;
}

/* Final Leg */
.final-leg-card{
  margin:0 20px 14px;padding:12px 14px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,rgba(16,185,129,0.1) 0%, var(--card) 100%);
  border:1px solid rgba(16,185,129,0.25);
}
.final-leg-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--green);margin-bottom:6px}

/* Assumptions / Warnings Lists */
.keyval-list{list-style:none}
.keyval-list li{
  font-size:11px;padding:5px 0;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;gap:8px;
}
.keyval-list li:last-child{border:none}
.keyval-k{color:var(--text3);font-weight:500;text-transform:capitalize}
.keyval-v{color:var(--text);font-weight:600;text-align:right}

.warn-card{
  font-size:11px;padding:8px 10px;border-radius:6px;background:var(--amber-glow);
  border:1px solid rgba(245,158,11,0.25);color:var(--amber);margin-bottom:6px;line-height:1.4;
}

/* Meta Footer */
.meta-footer{
  padding:10px 20px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;font-size:10.5px;color:var(--text3);
  background:var(--bg2);flex-shrink:0;
}
.pill{padding:2px 6px;border-radius:4px;background:var(--bg);font-variant-numeric:tabular-nums}
.pill.cached{color:var(--green);border:1px solid rgba(16,185,129,0.2)}

/* Leaflet Dark Styles */
.leaflet-control-zoom a{
  background:var(--bg2)!important;color:var(--text)!important;
  border-color:var(--border)!important;
}
.leaflet-popup-content-wrapper{
  background:var(--bg2);color:var(--text);border-radius:var(--radius-sm);
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.leaflet-popup-tip{background:var(--bg2)}
.leaflet-popup-content{font-family:'Inter',sans-serif;font-size:12px;margin:10px 12px;line-height:1.4}
.pop-title{font-weight:800;font-size:13px;margin-bottom:6px;color:#fff}
.pop-row{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-size:11.5px}
.pop-lbl{color:var(--text2)}.pop-val{font-weight:700}

@media(max-width:768px){
  :root{--panel-w:100vw}
  #panel{
    position:absolute;left:0;top:0;z-index:2000;
    height:55vh;width:100vw;min-width:100vw;border-right:none;border-bottom:1px solid var(--border);
  }
  #panel.collapsed{margin-left:0;margin-top:-55vh}
  #map-wrap{height:100vh}
}
</style>
</head>
<body>
<div class="app">
  <!-- Side Panel -->
  <div id="panel">
    <!-- Search Header -->
    <div class="search-header">
      <div class="logo-row">
        <div class="logo">
          <div class="logo-icon">&#9981;</div>
          <div class="logo-text">FuelRoute</div>
        </div>
        <div class="tag-badge">Optimal Planner</div>
      </div>

      <form id="search-form" class="search-row" autocomplete="off">
        <div class="input-wrap">
          <div class="inputs-col">
            <div class="input-group">
              <label>Origin</label>
              <input id="inp-start" type="text" placeholder="e.g. Chicago, IL" required>
            </div>
            <div class="input-group">
              <label>Destination</label>
              <input id="inp-finish" type="text" placeholder="e.g. Denver, CO" required>
            </div>
          </div>
          <button type="button" class="swap-btn" id="swap-btn" title="Swap start and finish">&#8645;</button>
        </div>

        <!-- Preset Chips -->
        <div class="presets">
          <button type="button" class="preset-chip" onclick="setRoute('Chicago, IL','Denver, CO')">Chicago &rarr; Denver</button>
          <button type="button" class="preset-chip" onclick="setRoute('New York, NY','Miami, FL')">NYC &rarr; Miami</button>
          <button type="button" class="preset-chip" onclick="setRoute('Los Angeles, CA','Dallas, TX')">LA &rarr; Dallas</button>
          <button type="button" class="preset-chip" onclick="setRoute('Seattle, WA','Salt Lake City, UT')">Seattle &rarr; SLC</button>
        </div>

        <button class="plan-btn" type="submit" id="plan-btn">
          <span class="btn-text">Plan Optimal Route</span>
        </button>
      </form>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" id="error-banner">
      <span style="font-size:14px">&#9888;</span>
      <span id="error-text" style="flex:1"></span>
      <span class="error-close" onclick="hideError()">&times;</span>
    </div>

    <!-- Scrollable Results -->
    <div class="panel-body" id="panel-body">
      <!-- Empty state -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">&#128506;</div>
        <div class="empty-title">Plan Your Route</div>
        <div class="empty-sub">Enter US origin &amp; destination or pick a preset above to calculate minimum-cost fuel stops.</div>
      </div>

      <!-- Results view -->
      <div id="results" style="display:none"></div>
    </div>

    <!-- Meta footer -->
    <div class="meta-footer" id="meta-footer" style="display:none">
      <span>API Calls: <span class="pill" id="meta-calls">0</span></span>
      <span id="meta-cache"></span>
      <span>Latency: <span class="pill" id="meta-time">0ms</span></span>
    </div>
  </div>

  <!-- Map -->
  <div id="map-wrap">
    <button class="toggle-btn" id="toggle-btn" title="Toggle side panel">&lsaquo;</button>
    <div id="m"></div>
  </div>
</div>

{% if data %}
{{ data|json_script:"d" }}
{% endif %}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Map Init ──
const map = L.map('m', {zoomControl:true}).setView([39.8, -98.6], 4);
const osmStandard = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
  maxZoom: 19
});
const osmHot = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors, Tiles style by Humanitarian OSM Team',
  maxZoom: 19
});
const darkLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
  maxZoom: 16
});
const streetLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS',
  maxZoom: 18
});

// Set OpenStreetMap (Original) as the active default
osmStandard.addTo(map);

L.control.layers({
  "OpenStreetMap (Original)": osmStandard,
  "OpenStreetMap (HOT)": osmHot,
  "Dark Canvas": darkLayer,
  "Esri Streets": streetLayer
}, null, { position: 'topright' }).addTo(map);

let routeLayer = null;
const markerLayer = L.layerGroup().addTo(map);
window._stopMarkers = [];

// ── Panel Toggle ──
const panel = document.getElementById('panel');
const toggleBtn = document.getElementById('toggle-btn');
toggleBtn.onclick = () => {
  const isCollapsed = panel.classList.toggle('collapsed');
  toggleBtn.innerHTML = isCollapsed ? '&rsaquo;' : '&lsaquo;';
  setTimeout(() => map.invalidateSize(), 300);
};

// ── Helpers ──
const $ = id => document.getElementById(id);
const fmt = (n, d = 2) => Number(n).toFixed(d);
const usd = n => '$' + fmt(n);
const pct = (v, max) => Math.min(100, Math.max(0, (v / max) * 100));

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function fuelClass(ratio) {
  if (ratio < 0.2) return 'low';
  if (ratio < 0.5) return 'mid';
  return 'high';
}

function showError(msg) {
  $('error-text').textContent = msg;
  $('error-banner').style.display = 'flex';
}
function hideError() {
  $('error-banner').style.display = 'none';
}

function setRoute(start, finish) {
  $('inp-start').value = start;
  $('inp-finish').value = finish;
  $('search-form').dispatchEvent(new Event('submit'));
}

$('swap-btn').onclick = () => {
  const s = $('inp-start').value;
  $('inp-start').value = $('inp-finish').value;
  $('inp-finish').value = s;
};

// ── Custom SVG Icons ──
function makeIcon(html, size = 30) {
  return L.divIcon({html, className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2]});
}
const startIcon = makeIcon('<svg viewBox="0 0 30 30" width="30" height="30"><circle cx="15" cy="15" r="13" fill="#7C4DFF" stroke="#fff" stroke-width="2.5"/><text x="15" y="20" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">A</text></svg>');
const endIcon = makeIcon('<svg viewBox="0 0 30 30" width="30" height="30"><circle cx="15" cy="15" r="13" fill="#10B981" stroke="#fff" stroke-width="2.5"/><text x="15" y="20" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">B</text></svg>');
function stopIcon(n) {
  return makeIcon(`<svg viewBox="0 0 30 30" width="30" height="30"><circle cx="15" cy="15" r="13" fill="#F59E0B" stroke="#fff" stroke-width="2.5"/><text x="15" y="19.5" text-anchor="middle" fill="#111827" font-size="11" font-weight="bold">${n}</text></svg>`);
}

// ── Render Plan ──
function render(d) {
  hideError();
  $('empty-state').style.display = 'none';
  const r = $('results');
  r.style.display = 'block';
  const tankCap = (d.assumptions && d.assumptions.tank_capacity_gallons) || 50;

  let html = '';

  // 1. Summary Cards
  html += `<div class="summary-grid">
    <div class="summary-card">
      <div class="summary-label">Trip Distance</div>
      <div class="summary-val accent">${fmt(d.distance_miles, 1)}<span style="font-size:12px;color:var(--text3)"> mi</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Fuel Stops</div>
      <div class="summary-val">${d.fuel_stops.length}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Purchased Gallons</div>
      <div class="summary-val">${fmt(d.purchased_gallons)}<span style="font-size:12px;color:var(--text3)"> gal</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Total Fuel Cost</div>
      <div class="summary-val green">${usd(d.total_fuel_cost)}</div>
    </div>
  </div>`;

  // 2. Cost Breakdown Bar
  html += `<div class="cost-breakdown">
    <div class="cost-title">Cost Breakdown</div>
    <div class="cost-row">
      <span class="cost-label"><span class="cost-dot" style="background:var(--accent)"></span>Route Fuel</span>
      <span class="cost-num">${usd(d.route_fuel_cost)}</span>
    </div>
    <div class="cost-row">
      <span class="cost-label"><span class="cost-dot" style="background:var(--amber)"></span>Detour Fuel</span>
      <span class="cost-num">${usd(d.detour_fuel_cost)}</span>
    </div>
    <div class="cost-row total">
      <span class="cost-label">Total Spend</span>
      <span class="cost-num">${usd(d.total_fuel_cost)}</span>
    </div>
  </div>`;

  // 3. Origin Start Fuel Card
  if (d.start_fuel) {
    html += `<div class="start-card">
      <div class="start-card-head">
        <span class="start-card-title">&#9981; Origin Fuel Purchase</span>
        <span style="font-size:11px;color:var(--accent2);font-weight:700">${usd(d.start_fuel.price_per_gallon)}/gal</span>
      </div>
      <div class="start-row"><span style="color:var(--text2)">Gallons Bought</span><span style="font-weight:700">${fmt(d.start_fuel.gallons)} gal</span></div>
      <div class="start-row"><span style="color:var(--text2)">Initial Cost</span><span style="font-weight:700;color:var(--green)">${usd(d.start_fuel.cost)}</span></div>
      ${d.start_fuel.note ? `<div class="start-note">${esc(d.start_fuel.note)}</div>` : ''}
    </div>`;
  }

  // 4. Fuel Stops List (Collapsible, open by default)
  html += `<div class="section open" id="sec-stops">
    <div class="section-head" onclick="toggleSec('sec-stops')">
      <span class="section-title">Optimal Fuel Stops</span>
      <div class="section-meta">
        <span class="badge">${d.fuel_stops.length} stops</span>
        <span class="chevron">&#9660;</span>
      </div>
    </div>
    <div class="section-body" id="stops-container">`;

  d.fuel_stops.forEach((s, idx) => {
    const arrRatio = (s.arrival_fuel_gallons || 0) / tankCap;
    const arrPctVal = pct(s.arrival_fuel_gallons || 0, tankCap);
    html += `<div class="stop-card" id="card-stop-${idx}" onclick="focusStop(${idx})">
      <div class="stop-top">
        <div class="stop-badge">${s.order}</div>
        <div class="stop-info">
          <div class="stop-name" title="${esc(s.name)}">${esc(s.name)}</div>
          <div class="stop-sub">${esc(s.city)}, ${esc(s.state)} &bull; Mile ${fmt(s.mile_marker, 1)}</div>
        </div>
        <div class="stop-price">${usd(s.price_per_gallon)}</div>
      </div>
      <div class="stop-metrics">
        <div class="stop-m-box">
          <div class="stop-m-val">${fmt(s.gallons_to_buy)}</div>
          <div class="stop-m-lbl">Gallons</div>
        </div>
        <div class="stop-m-box">
          <div class="stop-m-val" style="color:var(--green)">${usd(s.cost)}</div>
          <div class="stop-m-lbl">Cost</div>
        </div>
        <div class="stop-m-box">
          <div class="stop-m-val">${fmt(s.leg_distance_miles, 1)} mi</div>
          <div class="stop-m-lbl">Leg Dist</div>
        </div>
      </div>
      <div class="gauge">
        <span>Arr: ${fmt(s.arrival_fuel_gallons)}g</span>
        <div class="gauge-bar">
          <div class="gauge-fill ${fuelClass(arrRatio)}" style="width:${arrPctVal}%"></div>
        </div>
        <span style="color:var(--green)">Dep: ${fmt(s.departure_fuel_gallons)}g</span>
      </div>
      ${s.detour_miles > 0.05 ? `
      <div class="detour-info">
        <span>Detour: ${fmt(s.detour_miles, 1)} mi</span>
        <span>+${usd(s.detour_fuel_cost)} fuel</span>
      </div>` : ''}
    </div>`;
  });
  html += `</div></div>`;

  // 5. Final Leg Card
  if (d.final_leg) {
    html += `<div class="final-leg-card">
      <div class="final-leg-title">&#127937; Final Leg to Destination</div>
      <div class="start-row"><span style="color:var(--text2)">Distance</span><span style="font-weight:700">${fmt(d.final_leg.distance_miles, 1)} mi</span></div>
      <div class="start-row"><span style="color:var(--text2)">Arrival Fuel</span><span style="font-weight:700;color:${(d.final_leg.arrival_fuel_gallons || 0) < 5 ? 'var(--red)' : 'var(--green)'}">${fmt(d.final_leg.arrival_fuel_gallons)} gal</span></div>
    </div>`;
  }

  // 6. Warnings Section
  if (d.warnings && d.warnings.length) {
    html += `<div class="section" id="sec-warn">
      <div class="section-head" onclick="toggleSec('sec-warn')">
        <span class="section-title">&#9888; Warnings</span>
        <div class="section-meta">
          <span class="badge warn">${d.warnings.length}</span>
          <span class="chevron">&#9660;</span>
        </div>
      </div>
      <div class="section-body">`;
    d.warnings.forEach(w => {
      html += `<div class="warn-card">${esc(w)}</div>`;
    });
    html += `</div></div>`;
  }

  // 7. Assumptions Section
  if (d.assumptions) {
    html += `<div class="section" id="sec-assump">
      <div class="section-head" onclick="toggleSec('sec-assump')">
        <span class="section-title">&#128221; Assumptions</span>
        <span class="chevron">&#9660;</span>
      </div>
      <div class="section-body">
        <ul class="keyval-list">`;
    for (const [k, v] of Object.entries(d.assumptions)) {
      html += `<li><span class="keyval-k">${esc(k.replace(/_/g, ' '))}</span><span class="keyval-v">${esc(String(v))}</span></li>`;
    }
    html += `</ul></div></div>`;
  }

  r.innerHTML = html;

  // 8. Meta Footer
  if (d.meta) {
    $('meta-footer').style.display = 'flex';
    $('meta-calls').textContent = d.meta.external_api_calls != null ? d.meta.external_api_calls : '-';
    $('meta-time').textContent = d.meta.elapsed_ms != null ? fmt(d.meta.elapsed_ms, 1) + 'ms' : '-';
    $('meta-cache').innerHTML = d.meta.cached
      ? '<span class="pill cached">&check; cached</span>'
      : '<span class="pill">live</span>';
  }

  // 9. Map Layers & Markers
  markerLayer.clearLayers();
  window._stopMarkers = [];
  if (routeLayer) {
    map.removeLayer(routeLayer);
    routeLayer = null;
  }

  // Polyline
  if (d.route && d.route.coordinates) {
    const latlngs = d.route.coordinates.map(c => [c[1], c[0]]);
    routeLayer = L.polyline(latlngs, {
      color: '#7C4DFF',
      weight: 5,
      opacity: 0.85,
      smoothFactor: 1
    }).addTo(map);
    map.fitBounds(routeLayer.getBounds(), {padding: [50, 50]});
  }

  // Origin Marker
  if (d.start && d.start.lat != null) {
    L.marker([d.start.lat, d.start.lon], {icon: startIcon}).addTo(markerLayer)
      .bindPopup(`<div class="pop-title">Origin: ${esc(d.start.query)}</div>
        <div class="pop-row"><span class="pop-lbl">Coords</span><span class="pop-val">${fmt(d.start.lat,4)}, ${fmt(d.start.lon,4)}</span></div>`);
  }

  // Destination Marker
  if (d.finish && d.finish.lat != null) {
    L.marker([d.finish.lat, d.finish.lon], {icon: endIcon}).addTo(markerLayer)
      .bindPopup(`<div class="pop-title">Destination: ${esc(d.finish.query)}</div>
        <div class="pop-row"><span class="pop-lbl">Coords</span><span class="pop-val">${fmt(d.finish.lat,4)}, ${fmt(d.finish.lon,4)}</span></div>`);
  }

  // Fuel Stop Markers
  d.fuel_stops.forEach((s, idx) => {
    const mk = L.marker([s.lat, s.lon], {icon: stopIcon(s.order)}).addTo(markerLayer)
      .bindPopup(`<div class="pop-title">#${s.order}: ${esc(s.name)}</div>
        <div class="pop-row"><span class="pop-lbl">Location</span><span class="pop-val">${esc(s.city)}, ${esc(s.state)}</span></div>
        <div class="pop-row"><span class="pop-lbl">Mile Marker</span><span class="pop-val">${fmt(s.mile_marker,1)} mi</span></div>
        <div class="pop-row"><span class="pop-lbl">Price</span><span class="pop-val" style="color:var(--green)">${usd(s.price_per_gallon)}/gal</span></div>
        <div class="pop-row"><span class="pop-lbl">Purchase</span><span class="pop-val">${fmt(s.gallons_to_buy)} gal (${usd(s.cost)})</span></div>
        <div class="pop-row"><span class="pop-lbl">Fuel Arrival/Dep</span><span class="pop-val">${fmt(s.arrival_fuel_gallons)}g &rarr; ${fmt(s.departure_fuel_gallons)}g</span></div>
        ${s.detour_miles > 0.05 ? `<div class="pop-row"><span class="pop-lbl">Detour</span><span class="pop-val">${fmt(s.detour_miles,1)} mi (+${usd(s.detour_fuel_cost)})</span></div>` : ''}`);

    mk.on('click', () => {
      highlightCard(idx);
    });

    window._stopMarkers.push(mk);
  });
}

// ── Interactive Stop Selection ──
function focusStop(idx) {
  const mk = window._stopMarkers[idx];
  if (mk) {
    map.setView(mk.getLatLng(), 11);
    mk.openPopup();
  }
  highlightCard(idx);
}

function highlightCard(idx) {
  document.querySelectorAll('.stop-card').forEach((c, i) => {
    c.classList.toggle('active', i === idx);
  });
  const activeCard = document.getElementById(`card-stop-${idx}`);
  if (activeCard) {
    activeCard.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  }
}

function toggleSec(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

// ── Form Submit ──
$('search-form').onsubmit = async e => {
  e.preventDefault();
  hideError();
  const s = $('inp-start').value.trim();
  const f = $('inp-finish').value.trim();
  if (!s || !f) return;

  const btn = $('plan-btn');
  btn.classList.add('loading');

  try {
    const url = '/api/route/?' + new URLSearchParams({start: s, finish: f});
    const resp = await fetch(url);
    const data = await resp.json();
    if (!resp.ok) {
      showError(data.error || 'Failed to calculate route plan.');
      return;
    }
    render(data);
    history.replaceState(null, '', '/api/route/map/?' + new URLSearchParams({start: s, finish: f}));
  } catch (err) {
    showError('Network error connecting to API: ' + err.message);
  } finally {
    btn.classList.remove('loading');
  }
};

// ── Server Pre-rendered Data & Error ──
{% if error %}
showError("{{ error|escapejs }}");
{% endif %}

{% if data %}
(function(){
  try {
    const raw = document.getElementById('d').textContent;
    const d = JSON.parse(raw);
    $('inp-start').value = (d.start && d.start.query) || '';
    $('inp-finish').value = (d.finish && d.finish.query) || '';
    render(d);
  } catch(e) {
    console.error('Error parsing pre-loaded route data:', e);
  }
})();
{% endif %}
</script>
</body>
</html>
